apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
      - name: catalog-service
        image: herpinho/catalog-service:latest
        ports:
        - containerPort: 5002
        env:
        - name: DB_NAME
          value: catalog_db
        - name: DB_USER
          value: user
        - name: DB_PASSWORD
          value: password
        - name: DB_HOST
          value: postgres-catalog
        - name: DB_PORT
          value: "5432"
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  selector:
    app: catalog-service
  ports:
    - protocol: TCP
      port: 5002
      targetPort: 5002
  type: LoadBalancer